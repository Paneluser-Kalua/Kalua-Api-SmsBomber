<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalua Api Store - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 5px; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .channel-tag { font-size: 13px; color: #a5b4fc; margin-bottom: 25px; letter-spacing: 1px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); }
        button:active { transform: translateY(0); }
        #result {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            word-break: break-all;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer { margin-top: 25px; font-size: 11px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>KaluaApiStore</h1>
        <div class="channel-tag">Admin: @KaluaApiAdmin | Channel: @KaluaApiStore</div>
        
        <div class="form-group">
            <label>Target Number</label>
            <input type="tel" id="number" placeholder="Enter 10 digit number" maxlength="15">
        </div>
        
        <div class="form-group">
            <label>Request Count</label>
            <input type="number" id="count" value="1" min="1" max="10">
        </div>

        <button onclick="sendRequest()">Execute API</button>
        
        <div id="result"></div>
        <div class="footer">Secured & Powered by Vercel Edge</div>
    </div>

    <script>
        async function sendRequest() {
            const number = document.getElementById('number').value.trim();
            const count = document.getElementById('count').value;
            const resultBox = document.getElementById('result');

            if (!number) {
                alert('Please enter a target number!');
                return;
            }

            resultBox.style.display = 'block';
            resultBox.innerHTML = 'Processing request...';

            try {
                const response = await fetch('/api/bomb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number, count })
                });
                const data = await response.json();
                resultBox.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                resultBox.innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
